name: Sync published release
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify public release and tagged changelog
        env:
          GH_TOKEN: ${{ secrets.PROOF_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'PROOF_REPO_TOKEN is required for the tagged app changelog'; exit 1; }
          npm run refresh:release
      - run: npm run check
      - name: Commit verified release snapshot
        run: |
          if git diff --quiet -- data release-notes/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data release-notes/index.html
          git commit -m 'Sync verified public Proof release'
          git push
